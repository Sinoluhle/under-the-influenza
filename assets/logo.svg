<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Under The Influenza</title>
  <desc id="desc">Circular black logo with white text reading Under The Influenza, UTI and podcast mic.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.28"/>
    </filter>
  </defs>

  <circle cx="600" cy="600" r="540" fill="#050505" stroke="#f2f2f2" stroke-width="26"/>
  <circle cx="600" cy="600" r="500" fill="#050505" stroke="#f2f2f2" stroke-width="10" fill-opacity="0.94"/>

  <text x="600" y="220" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="8" fill="#f4f4f4" textLength="940">UNDER THE INFLUENZA</text>

  <text x="600" y="640" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="430" font-weight="800" fill="#f5f5f5">UTI</text>

  <g transform="translate(600 740)" filter="url(#shadow)">
    <g transform="translate(-170 0)">
      <circle cx="0" cy="0" r="88" fill="#f5f5f5"/>
      <circle cx="0" cy="0" r="62" fill="#0b0b0b"/>
      <g fill="#f5f5f5" opacity="0.9">
        <circle cx="0" cy="-18" r="8"/>
        <circle cx="18" cy="-6" r="8"/>
        <circle cx="-18" cy="-6" r="8"/>
        <circle cx="32" cy="18" r="8"/>
        <circle cx="-32" cy="18" r="8"/>
        <circle cx="0" cy="30" r="8"/>
        <circle cx="18" cy="42" r="8"/>
        <circle cx="-18" cy="42" r="8"/>
      </g>
    </g>

    <g>
      <rect x="-32" y="88" width="64" height="146" rx="35" fill="#f5f5f5"/>
      <rect x="-148" y="148" width="296" height="46" rx="22" fill="#f5f5f5"/>
      <rect x="-30" y="190" width="60" height="70" rx="26" fill="#f5f5f5"/>
    </g>
  </g>

  <text x="600" y="990" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="120" font-weight="700" letter-spacing="10" fill="#f4f4f4">EST. 26</text>
</svg>
